seed: 7

data:
  sources:
    - glob: data/smoke/train/normal/*.pcap
      split: train
      label: normal
    - glob: data/smoke/calibration/normal/*.pcap
      split: calibration
      label: normal
    - glob: data/smoke/test/normal/*.pcap
      split: test
      label: normal
    - glob: data/smoke/test/attack/*.pcap
      split: test
      label: attack
  manifest: null
  label_from_parent: false
  normal_labels: [normal, benign]
  attack_labels: [attack, anomaly, malicious]
  processed_path: data/processed/smoke_v4.npz
  metadata_path: data/processed/smoke_v4.metadata.json
  baseline_reader_path: ../baselines/bpf-dag/data/pcap.py
  allowed_protocols: [tcp, udp]
  flow_window_seconds: 3.0
  micro_bin_seconds: 0.1
  flow_orientation: directional
  window_alignment: epoch
  microbin_feature_profile: directional_iat_v1
  min_packets_per_segment: 1

flow_model:
  architecture: v2
  anomaly_score: reconstruction_only
  embedding_dim: 16
  hidden_channels: 16
  tcn_blocks: 2
  kernel_size: 3
  dropout: 0.0
  mask_ratio: 0.2
  score_mask_ratio: 0.2
  score_mask_rounds: 3
  nonempty_loss_weight: 4.0
  active_error_weight: 0.8
  epochs: 3
  batch_size: 16
  learning_rate: 0.003
  weight_decay: 0.0
  gradient_clip: 5.0
  early_stopping_patience: 3

context_model:
  mode: neural_intensity
  pair_enabled: true
  entity_enabled: true
  hidden_dim: 24
  latent_channels: 4
  assignment_temperature: 0.5
  scope_temperature: 1.0
  min_log_scale: -3.0
  max_log_scale: 2.0
  balance_weight: 0.10
  entropy_weight: 0.02
  epochs: 4
  learning_rate: 0.003
  weight_decay: 0.0
  gradient_clip: 5.0
  early_stopping_patience: 4
  inference_batch_size: 64

scoring:
  fusion: robust_logsumexp
  fusion_temperature: 0.5
  component_low_quantile: 0.05
  component_high_quantile: 0.95
  deployment_fpr: 0.10

runtime:
  device: cpu
  num_workers: 0
  output_dir: outputs/smoke_v4
  embeddings_path: outputs/smoke_v4/embeddings.npz
  flow_checkpoint: outputs/smoke_v4/flow_model.pt
  neural_context_checkpoint: outputs/smoke_v4/neural_context_model.pt
  calibration_path: outputs/smoke_v4/calibration.json
  scores_path: outputs/smoke_v4/test_scores.csv
  metrics_path: outputs/smoke_v4/test_metrics.json
